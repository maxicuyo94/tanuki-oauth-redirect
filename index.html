<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
    <title>Conectar Mercado Libre con Tanuki</title>
    <style>
      /* Colores del sistema de diseño de Tanuki (taller-admin, docs/sistema-de-diseno.md), en claro y en oscuro. */
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        --page: oklch(0.984 0.003 247.858); /* slate-50 */
        --surface: #fff;
        --text: oklch(0.208 0.042 265.755); /* slate-900 */
        --muted: oklch(0.446 0.043 257.281); /* slate-600 */
        --border: oklch(0.869 0.022 252.894); /* slate-300 */
        --field: oklch(0.984 0.003 247.858);
        --brand: oklch(0.56 0.17 42); /* brand-600 */
        --brand-hover: oklch(0.47 0.15 38);
        --brand-text: oklch(0.47 0.15 38); /* brand-700 */
        --on-brand: #fff;
        --focus: oklch(0.64 0.17 48); /* brand-500 */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: oklch(0.17 0.02 265);
          --surface: oklch(0.21 0.02 265);
          --text: oklch(0.95 0.005 260);
          --muted: oklch(0.77 0.02 260);
          --border: oklch(0.4 0.03 265);
          --field: oklch(0.17 0.02 265);
          --brand: oklch(0.62 0.17 45);
          --brand-hover: oklch(0.7 0.16 50);
          --brand-text: oklch(0.82 0.11 60);
          --on-brand: oklch(0.17 0.02 265);
        }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); }
      main { box-sizing: border-box; width: min(100% - 2rem, 36rem); padding: 2rem; border: 1px solid var(--border); border-radius: .75rem; background: var(--surface); }
      .eyebrow { margin: 0 0 .25rem; color: var(--brand-text); font-size: .875rem; font-weight: 600; }
      h1 { margin: 0 0 1rem; font-size: 1.5rem; font-weight: 600; }
      p { line-height: 1.5; }
      #intro, #status { color: var(--muted); }
      label { display: block; margin-bottom: .375rem; font-size: .875rem; font-weight: 500; }
      textarea { box-sizing: border-box; width: 100%; min-height: 7rem; padding: .75rem; resize: vertical; border: 1px solid var(--border); border-radius: .5rem; background: var(--field); color: var(--text); font: .85rem ui-monospace, monospace; overflow-wrap: anywhere; }
      button { margin-top: .75rem; min-height: 2.75rem; padding: .5rem 1rem; border: 0; border-radius: .5rem; background: var(--brand); color: var(--on-brand); font: inherit; font-size: .875rem; font-weight: 500; cursor: pointer; }
      button:hover { background: var(--brand-hover); }
      button:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      #status { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Tanuki</p>
      <h1>Conectar Mercado Libre con Tanuki</h1>
      <p id="intro">Preparando la autorización…</p>
      <div id="result" hidden>
        <label for="redirect-url">URL de retorno</label>
        <textarea id="redirect-url" readonly></textarea>
        <button id="copy" type="button">Copiar URL</button>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const intro = document.getElementById('intro');
      const result = document.getElementById('result');
      if (params.has('code') && params.has('state')) {
        const callbackUrl = location.href;
        history.replaceState(null, '', location.pathname);
        document.getElementById('redirect-url').value = callbackUrl;
        intro.textContent = 'Mercado Libre autorizó la conexión. Copiá esta URL y pegala en Tanuki, en Configuración → Mercado Libre.';
        result.hidden = false;
        document.getElementById('copy').addEventListener('click', async () => {
          const field = document.getElementById('redirect-url');
          try {
            await navigator.clipboard.writeText(callbackUrl);
            document.getElementById('status').textContent = 'URL copiada. Volvé a Tanuki para terminar.';
          } catch {
            field.select();
            document.getElementById('status').textContent = 'Copiá el texto seleccionado y volvé a Tanuki.';
          }
        });
      } else if (params.has('error')) {
        history.replaceState(null, '', location.pathname);
        intro.textContent = 'Mercado Libre no autorizó la conexión. Volvé a Tanuki e intentá nuevamente.';
      } else {
        intro.textContent = 'Esta página recibe la autorización de Mercado Libre. Iniciá la conexión desde Tanuki.';
      }
    </script>
  </body>
</html>
